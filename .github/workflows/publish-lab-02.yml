name: Lab 2 Pipeline

on: [push, pull_request]

permissions:
  contents: read
  packages: write

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installing Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r lab-02/requirements.txt -r lab-02/requirements-dev.txt

      - name: Start tests
        run: PYTHONPATH=lab-02 pytest lab-02/tests

  docker_build:
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Building image
        run: docker build -t lab2_image:${{ github.sha }} ./lab-02

  deploy:
    needs: [suite, docker_build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: ./lab-02
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/catshop-lab02:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - name: Print image digest
        run: echo "ghcr.io/${{ github.repository_owner }}/catshop-lab02@${{ steps.build_push.outputs.digest }}"